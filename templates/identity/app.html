{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quality Life · {{ tenant.organization.name }}</title>
    <link rel="stylesheet" href="{% static 'quality_life/foundation.css' %}">
    <link rel="stylesheet" href="{% static 'quality_life/identity.css' %}">
</head>
<body>
    <main class="foundation">
        <p class="foundation__eyebrow">Quality Life</p>
        <h1>{{ tenant.organization.name }}</h1>
        <p>Você entrou no contexto desta organização.</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Sair</button>
        </form>
    </main>
</body>
</html>
