{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selecionar organização · Quality Life</title>
    <link rel="stylesheet" href="{% static 'quality_life/brand.css' %}">
    <link rel="stylesheet" href="{% static 'quality_life/foundation.css' %}">
    <link rel="stylesheet" href="{% static 'quality_life/identity.css' %}">
    <link rel="stylesheet" href="{% static 'quality_life/app-dark.css' %}">
    <script src="{% static 'quality_life/vendor/gsap-3.13.0.min.js' %}" defer></script>
    <script src="{% static 'quality_life/app-motion.js' %}" defer></script>
</head>
<body>
    <canvas class="ql-ambient" id="ql-ambient" data-ambient="lite" aria-hidden="true"></canvas>
    <script src="{% static 'quality_life/ambient.js' %}" defer></script>
    <main class="foundation">
        <img class="foundation__logo" src="{% static 'quality_life/images/brand/quality-life-logo-ring-192.png' %}" alt="" width="72" height="72">
        <p class="foundation__eyebrow">Quality Life</p>
        <h1>Selecione sua organização</h1>
        <ul class="organizations">
            {% for membership in memberships %}
            <li>
                <form method="post" action="{% url 'select_organization' %}">
                    {% csrf_token %}
                    <input type="hidden" name="organization" value="{{ membership.organization.slug }}">
                    <button type="submit">{{ membership.organization.name }}</button>
                </form>
            </li>
            {% endfor %}
        </ul>
        {% if user.is_superuser %}<p><a href="{% url 'operator_panel' %}">Painel da Quality Life</a></p>{% endif %}
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Sair</button>
        </form>
    </main>
</body>
</html>
