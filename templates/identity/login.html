{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Quality Life</title>
    <link rel="stylesheet" href="{% static 'quality_life/foundation.css' %}">
    <link rel="stylesheet" href="{% static 'quality_life/identity.css' %}">
</head>
<body>
    <main class="foundation">
        <p class="foundation__eyebrow">Quality Life</p>
        <h1>Entrar</h1>
        {% if form.errors %}<p role="alert">Email ou senha inválidos.</p>{% endif %}
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <label for="id_username">Email</label>
            {{ form.username }}
            <label for="id_password">Senha</label>
            {{ form.password }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
