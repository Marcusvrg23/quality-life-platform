{% for error in form.non_field_errors %}<p class="login-error" role="alert">{{ error }}</p>{% endfor %}
{% for field in form %}
<label for="{{ field.id_for_label }}">{{ field.label }}</label>
{{ field }}
{% if field.errors %}<ul class="login-field-errors" role="alert">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
{% if field.help_text %}<div class="login-hint">{{ field.help_text }}</div>{% endif %}
{% endfor %}
