{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} · Quality Life</title>
    <style>img { max-width: 100%; height: auto; }</style>
    <link rel="stylesheet" href="{% static 'quality_life/legal.css' %}">
</head>
<body class="legal-page">
    <p class="legal-draft" role="note">MINUTA — pendente de revisão jurídica</p>
    <header class="legal-header">
        <a class="legal-brand" href="{% url 'login' %}"><img src="{% static 'quality_life/images/quality-life-logo.png' %}" width="48" height="48" alt=""> <strong>Quality Life</strong></a>
        <nav class="legal-nav" aria-label="Documentos"><a href="{% url 'privacy' %}">Privacidade</a><a href="{% url 'terms' %}">Termos</a></nav>
    </header>
    <main class="legal-main">{% block content %}{% endblock %}</main>
    <footer class="legal-footer"><a href="{% url 'login' %}">Voltar para o login</a></footer>
</body>
</html>
