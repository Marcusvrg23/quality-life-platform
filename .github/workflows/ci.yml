name: Django foundation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quality_life_ci
          POSTGRES_USER: quality_life_ci
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quality_life_ci -d quality_life_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-production-use-4f9e1d7a8c2b6e0f3a5d9c1b7e4f8a2d
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: testserver,localhost
      DJANGO_SECURE_HSTS_SECONDS: "31536000"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
      DJANGO_SECURE_HSTS_PRELOAD: "true"
      POSTGRES_DB: quality_life_ci
      POSTGRES_TEST_DB: test_quality_life_ci
      POSTGRES_USER: quality_life_ci
      POSTGRES_PASSWORD: ci-database-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONNECT_TIMEOUT: "5"
      POSTGRES_SSLMODE: prefer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run lint and format checks
        run: |
          ruff check .
          ruff format --check .
      - name: Run Django checks
        run: python manage.py check --database default --settings=config.settings.test
      - name: Run production security checks
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.production
        env:
          POSTGRES_SSLMODE: require
      - name: Validate migrations
        run: |
          python manage.py makemigrations --check --dry-run --settings=config.settings.test
          python manage.py migrate --noinput --settings=config.settings.test
          python manage.py migrate --check --settings=config.settings.test
      - name: Run tests
        run: python manage.py test --settings=config.settings.test
